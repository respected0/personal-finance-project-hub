name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Manifest, Docs, Repo Map, Boundaries & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.18.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Manifest Schema & Canonical URLs Validation
        run: pnpm manifest:check

      - name: Release SemVer & Index Consistency Check
        run: pnpm release:check

      - name: Hub Zero Domain Code Boundaries Check
        run: pnpm boundaries:check

      - name: Documentation Truth & Link Validation
        run: pnpm docs:check

      - name: Repository Map 100% Coverage Check
        run: pnpm repo-map:check

      - name: Fast Working Tree Secret Scan
        run: pnpm security:secret-scan

      - name: Run Regression Test Suite
        run: pnpm test:unit
